name: Update dashboard data
on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dashboard-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decrypt, refresh and encrypt dashboard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: node site-tools/update.mjs
      - name: Commit data snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html protected.enc.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Star data snapshot'
            git push
          fi
      - name: Prepare public site
        run: |
          mkdir public
          cp index.html public/
          cp -R assets public/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
